name: 'Release to GitHub'

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GO_VERSION: '^1.25'
  JAVA_VERSION: '21'

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, ext: ''     }
          - { goos: linux,   goarch: arm64, ext: ''     }
          - { goos: darwin,  goarch: amd64, ext: ''     }
          - { goos: darwin,  goarch: arm64, ext: ''     }
          - { goos: windows, goarch: amd64, ext: '.exe' }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Read game version
        id: cfg
        run: |
          VERSION=$(jq -r '.game_version' version.json)
          echo "MC_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "JAR_FILENAME=server-$VERSION.jar" >> "$GITHUB_ENV"
          echo "Game version: $VERSION"

      - name: Cache Minecraft jar
        uses: actions/cache@v4
        with:
          path: ${{ env.JAR_FILENAME }}
          key: mc-server-jar-${{ env.MC_VERSION }}

      - name: Generate code
        run: make gen

      - name: Build optimized binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          BIN="mcgoserv-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          echo "Building $BIN (GOOS=$GOOS GOARCH=$GOARCH)"
          make build BINARY_NAME="$BIN" BRANCH="${{ github.ref_name }}"
          ls -lh "$BIN"
          echo "ARTIFACT=$BIN" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish draft release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read game version
        run: |
          VERSION=$(jq -r '.game_version' version.json)
          echo "MC_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            **Game Version:** `${{ env.MC_VERSION }}`
            **Tag:** `${{ github.ref_name }}`

            Binaries are built with `CGO_ENABLED=0`, `-trimpath`, and stripped symbols (`-s -w`)
            for the following targets:

            - `linux/amd64`, `linux/arm64`
            - `darwin/amd64`, `darwin/arm64`
            - `windows/amd64`
