name: 'Release to GitHub'

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GO_VERSION: '^1.25'

jobs:
  # Code generation is platform-independent and costs a jar download plus a full
  # Java data-generator run, so it happens once here and every target is then
  # cross-compiled from the same generated tree.
  build:
    name: Build all targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Read game version
        run: ./scripts/ci-versions.sh

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Minecraft jar
        uses: actions/cache@v4
        with:
          path: ${{ env.JAR_FILENAME }}
          key: mc-server-jar-${{ env.MC_VERSION }}

      - name: Generate code
        run: make gen

      - name: Build optimized binaries
        env:
          CGO_ENABLED: '0'
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for TARGET in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${TARGET%/*}"
            GOARCH="${TARGET#*/}"
            case "$GOOS" in windows) EXT='.exe' ;; *) EXT='' ;; esac
            BIN="mcgoserv-$TAG-$GOOS-$GOARCH$EXT"
            echo "Building $BIN"
            GOOS="$GOOS" GOARCH="$GOARCH" make build BINARY_NAME="dist/$BIN" BRANCH="$TAG"
          done
          ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish draft release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read game version
        run: |
          VERSION=$(jq -r '.game_version' version.json)
          echo "MC_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            **Game Version:** `${{ env.MC_VERSION }}`
            **Tag:** `${{ github.ref_name }}`

            Binaries are built with `CGO_ENABLED=0`, `-trimpath`, and stripped symbols (`-s -w`)
            for the following targets:

            - `linux/amd64`, `linux/arm64`
            - `darwin/amd64`, `darwin/arm64`
            - `windows/amd64`
