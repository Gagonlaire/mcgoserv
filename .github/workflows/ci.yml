name: 'CI'

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '^1.25'

jobs:
  # Every internal/**/*_gen.go is gitignored, so a stale generated file on a
  # developer machine can mask a missing //go:generate directive indefinitely.
  # Building from a clean tree is the only thing that catches it. Runs for fork
  # PRs too, unlike the preview deploy.
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Read game version
        run: ./scripts/ci-versions.sh

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Minecraft jar
        uses: actions/cache@v4
        with:
          path: ${{ env.JAR_FILENAME }}
          key: mc-server-jar-${{ env.MC_VERSION }}

      - name: Generate code
        run: make gen

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
